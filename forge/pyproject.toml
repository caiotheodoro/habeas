[project]
name = "i9forge-forge"
version = "0.1.0"
description = "I9forge: seeded I-9/document generator + M-274/8 CFR oracle + benchmark"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pillow>=11.0",
    "numpy>=1.26",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]