[project]
name = "habeas-model"
version = "0.1.0"
description = "Habeas: dataset builder, QLoRA SFT, GRPO RLVR, benchmark eval"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "torch>=2.3",
    "transformers>=4.55",
    "peft>=0.13",
    "trl>=0.16",
    "accelerate>=1.0",
    "datasets>=3.0",
    "pillow>=11.0",
    "huggingface_hub>=0.26",
    "click>=8.1",
    "numpy>=1.26",
    "bitsandbytes>=0.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "unsloth>=2025.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
